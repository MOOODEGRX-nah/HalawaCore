name: Build desktop releases
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', 'packaging/**', '*.md', 'index.html', 'app.html', '.nojekyll', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: HalawaCore-Linux-x64.tar.gz
          - os: windows-latest
            asset: HalawaCore-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check interface languages
        run: node tests/languages.mjs
      - name: Linux tests
        if: runner.os == 'Linux'
        run: python -m pytest -q
      - name: Windows topology fixtures
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_windows.py tests/test_desktop_launch.py
      - name: Build executable
        run: python build_desktop.py
      - name: Verify Linux executable
        if: runner.os == 'Linux'
        env:
          HALAWACORE_DATA_DIR: ${{ runner.temp }}/halawacore-test
        run: ./dist/desktop/HalawaCore --self-test --self-test-file dist/self-test-Linux.json
      - name: Verify Linux browser launch and manual fallback
        if: runner.os == 'Linux'
        run: python tests/verify_packaged_browser.py dist/desktop/HalawaCore
      - name: Verify Windows executable
        if: runner.os == 'Windows'
        env:
          HALAWACORE_DATA_DIR: ${{ runner.temp }}/halawacore-test
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'dist/self-test-Windows.json'
          $process = Start-Process -FilePath './dist/desktop/HalawaCore.exe' -ArgumentList @('--self-test','--self-test-file', $report) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Executable test failed: $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.topology -ne 'ok' -or $result.error) { throw 'Native Windows verification failed' }
          Get-Content $report
      - name: Package executable and report
        env:
          RELEASE_ASSET: ${{ matrix.asset }}
        run: python release_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/releases/*
  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version="$(cat VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            published_sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
            if [ "$published_sha" != "$RELEASE_SHA" ]; then
              echo "Release $tag already belongs to another commit. Increase VERSION."
              exit 1
            fi
            echo "Release $tag already published for this commit. Keeping its assets."
            exit 0
          fi
          gh release create "$tag" release-assets/* --target "$RELEASE_SHA" --title "HalawaCore $version" --notes-file docs/RELEASE-NOTES.md
