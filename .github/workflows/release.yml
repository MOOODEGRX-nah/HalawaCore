name: Build desktop releases
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', 'packaging/**', '*.md', 'index.html', 'app.html', '.nojekyll', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: HalawaCore-Linux-x64.tar.gz
          - os: windows-latest
            asset: HalawaCore-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check interface languages
        run: |
          node tests/languages.mjs
          node tests/process-selection.mjs
          node tests/measurements.mjs
      - name: Linux tests
        if: runner.os == 'Linux'
        run: python -m pytest -q
      - name: Windows topology fixtures
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_windows.py tests/test_desktop_launch.py tests/test_multi_affinity.py tests/test_measurements.py tests/test_updater.py
      - name: Build executable
        run: python build_desktop.py
      - name: Verify Linux executable
        if: runner.os == 'Linux'
        env:
          HALAWACORE_DATA_DIR: ${{ runner.temp }}/halawacore-test
        run: ./dist/desktop/HalawaCore --self-test --self-test-file dist/self-test-Linux.json
      - name: Verify Linux browser launch and manual fallback
        if: runner.os == 'Linux'
        run: python tests/verify_packaged_browser.py dist/desktop/HalawaCore
      - name: Verify Windows executable
        if: runner.os == 'Windows'
        env:
          HALAWACORE_DATA_DIR: ${{ runner.temp }}/halawacore-test
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'dist/self-test-Windows.json'
          $process = Start-Process -FilePath './dist/desktop/HalawaCore.exe' -ArgumentList @('--self-test','--self-test-file', $report) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Executable test failed: $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.topology -ne 'ok' -or $result.error) { throw 'Native Windows verification failed' }
          Get-Content $report
      - name: Verify packaged portable update staging and replacement
        run: python tests/verify_packaged_update.py dist/desktop/${{ runner.os == 'Windows' && 'HalawaCore.exe' || 'HalawaCore' }}
      - name: Package executable and report
        env:
          RELEASE_ASSET: ${{ matrix.asset }}
        run: python release_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/releases/*
  arch:
    needs: build
    runs-on: ubuntu-22.04
    container: archlinux/archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HalawaCore-Linux-x64.tar.gz
          path: arch-input
      - name: Install packaging interpreter inside the build container
        run: pacman -Syu --noconfirm --needed python
      - name: Prepare verified Arch recipe
        run: python prepare_arch_release.py arch-input/HalawaCore-Linux-x64.tar.gz build/arch-release
      - name: Build Arch package as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder build/arch-release
          runuser -u builder -- bash -c 'cd build/arch-release && makepkg --nodeps --noconfirm --cleanbuild'
          mkdir -p dist/releases
          cp build/arch-release/*.pkg.tar.zst dist/releases/HalawaCore-Arch-x64.pkg.tar.zst
          pacman -Qip dist/releases/HalawaCore-Arch-x64.pkg.tar.zst
          python prepare_arch_release.py --verify dist/releases/HalawaCore-Arch-x64.pkg.tar.zst arch-input/HalawaCore-Linux-x64.tar.gz
          python -c "import hashlib,pathlib; p=pathlib.Path('dist/releases/HalawaCore-Arch-x64.pkg.tar.zst'); pathlib.Path(str(p)+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: HalawaCore-Arch-x64.pkg.tar.zst
          path: dist/releases/*
  release:
    needs: [build, arch]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version="$(cat VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            published_sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)"
            if [ "$published_sha" != "$RELEASE_SHA" ]; then
              echo "Release $tag already belongs to another commit. Increase VERSION."
              exit 1
            fi
            echo "Release $tag already published for this commit. Keeping its assets."
            exit 0
          fi
          gh release create "$tag" release-assets/* --target "$RELEASE_SHA" --title "HalawaCore $version" --notes-file docs/RELEASE-NOTES.md
